# mujoco_replay.yaml
# Config for replay_positions.py
# Usage: python replay_positions.py motion_rep=position
 
# ── Paths ─────────────────────────────────────────────────────────────────────
scene_xml: ~/projects/human-modeling-3d/assets/human/scene.xml
 
motion_file: ~/projects/human-modeling-3d/data/modiff-2022-samp-from-text/samples_humanml_trans_dec_512_bert_000600000_seed10_a_person_is_walking_forward_and_picking_something_from_the_ground_with_one_hand/results.pkl
 
mean_path: ~/projects/human-modeling-3d/data/modiff-2022-samp-from-text/Mean.npy
std_path:  ~/projects/human-modeling-3d/data/modiff-2022-samp-from-text/Std.npy
 
# ── Motion ────────────────────────────────────────────────────────────────────
motion_idx: 0       # which sample to replay from the pkl file
 
# motion_rep: how to drive the skeleton
#   position  - use recover_from_ric joint positions, compute rotations geometrically
#   rotation  - use rot6d features directly from the 263-dim representation
motion_rep: rotation  # options: position, rotation
 
# ── Playback ──────────────────────────────────────────────────────────────────
fps: 30
loop: true
 